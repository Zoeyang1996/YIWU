<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>海上丝绸之路 · 方案二「海图长卷」</title>
<style>
  :root {
    --paper: #f3ead6;
    --ink: #4a3f33;
    --vermilion: #b6452f;
    --teal: #2c5f63;
    --gold: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    background:
      radial-gradient(120% 90% at 50% 0%, #efe6cf 0%, #e6dcc2 45%, #c9c4ab 100%);
    color: var(--ink);
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; cursor: grab; }
  #app canvas:active { cursor: grabbing; }

  header {
    position: fixed; top: 22px; left: 26px; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    pointer-events: none; user-select: none;
  }
  .seal {
    width: 58px; height: 58px; border-radius: 10px;
    background: var(--vermilion);
    color: #fdf6e7; font-size: 21px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; letter-spacing: 2px;
    box-shadow: 0 3px 10px rgba(182, 69, 47, .35), inset 0 0 0 2px rgba(253,246,231,.55);
    transform: rotate(-3deg);
  }
  .title h1 { font-size: 26px; letter-spacing: 8px; font-weight: 700; }
  .title p { margin-top: 6px; font-size: 13px; letter-spacing: 4px; opacity: .75; }

  .switch {
    position: fixed; top: 26px; right: 26px; z-index: 10;
    font-size: 13px; letter-spacing: 2px;
  }
  .switch a {
    display: inline-block; padding: 9px 16px; margin-left: 8px;
    border: 1.5px solid var(--ink); border-radius: 999px;
    color: var(--ink); text-decoration: none; background: rgba(243,234,214,.7);
    transition: all .2s;
  }
  .switch a.on { background: var(--ink); color: var(--paper); }
  .switch a:hover { box-shadow: 0 2px 8px rgba(74,63,51,.3); }

  #portList {
    position: fixed; left: 26px; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 10px;
  }
  .port-chip {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 14px 7px 10px; border-radius: 999px;
    background: rgba(243, 234, 214, .85); border: 1.5px solid rgba(74,63,51,.45);
    font-size: 14px; letter-spacing: 3px; cursor: pointer; user-select: none;
    transition: all .2s; backdrop-filter: blur(2px);
  }
  .port-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); transition: all .2s; flex: none; }
  .port-chip:hover { transform: translateX(4px); box-shadow: 0 3px 10px rgba(74,63,51,.22); }
  .port-chip.cur { background: var(--vermilion); border-color: var(--vermilion); color: #fdf6e7; }
  .port-chip.cur i { background: var(--gold); }

  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 13px; letter-spacing: 3px; opacity: .8;
    background: rgba(243,234,214,.78); padding: 8px 22px; border-radius: 999px;
    border: 1px solid rgba(74,63,51,.3); user-select: none; pointer-events: none;
    white-space: nowrap;
  }

  #arriveCard {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(24px);
    z-index: 20; width: min(430px, 86vw);
    background: linear-gradient(160deg, #f8f1de, #efe3c8);
    border: 1.5px solid var(--ink); border-radius: 14px;
    box-shadow: 0 12px 34px rgba(74,63,51,.3);
    padding: 20px 24px 18px; opacity: 0; pointer-events: none;
    transition: all .45s cubic-bezier(.2,.9,.3,1.2);
  }
  #arriveCard.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #arriveCard h2 { font-size: 24px; letter-spacing: 6px; display: flex; align-items: baseline; gap: 10px; }
  #arriveCard h2 small { font-size: 12px; letter-spacing: 2px; color: var(--vermilion); }
  #arriveCard .line { height: 1px; background: linear-gradient(90deg, var(--ink), transparent); margin: 10px 0; opacity: .5; }
  #arriveCard p { font-size: 14px; line-height: 1.8; letter-spacing: 1.5px; opacity: .88; }
  #arriveCard .row { display: flex; gap: 12px; margin-top: 14px; }
  #arriveCard button {
    flex: 1; padding: 11px 0; font-size: 15px; letter-spacing: 4px;
    font-family: inherit; border-radius: 9px; cursor: pointer; transition: all .2s;
  }
  #btnExplore { background: var(--vermilion); color: #fdf6e7; border: none; box-shadow: 0 4px 12px rgba(182,69,47,.35); }
  #btnExplore:hover { transform: translateY(-2px); box-shadow: 0 7px 16px rgba(182,69,47,.4); }
  #btnSail { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  #btnSail:hover { background: rgba(74,63,51,.08); }

  @media (max-width: 720px) {
    #portList { left: 12px; gap: 7px; }
    .port-chip { font-size: 12px; padding: 5px 10px 5px 8px; letter-spacing: 2px; }
    header { left: 14px; top: 14px; gap: 10px; }
    .title h1 { font-size: 19px; letter-spacing: 4px; }
    .title p { font-size: 11px; }
    .seal { width: 46px; height: 46px; font-size: 16px; }
    .switch { top: 16px; right: 12px; }
    .switch a { padding: 6px 10px; font-size: 11px; margin-left: 4px; }
    #hint { font-size: 11px; letter-spacing: 1px; padding: 7px 12px; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>

</head>
<body>
<div id="app"></div>

<header>
  <div class="seal">海丝</div>
  <div class="title">
    <h1>海上丝绸之路</h1>
    <p>海图长卷</p>
  </div>
</header>

<nav class="atlas-nav"><select id="portSelect" aria-label="选择港口"></select></nav>

<section id="arriveCard" aria-live="polite">
  <h2><span id="portName">泉州</span><small id="portTag">刺桐古港</small></h2>
  <div class="line"></div>
  <p id="portIntro"></p>
  <div class="row">
    <button id="btnExplore">下船探索</button>
    <button id="btnSail">继续览卷</button>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { createArtMaterials, merchantHouse, harborShip } from './silk-road-art.js';
import { mountCart } from './silk-road-cart.js';
const bag=mountCart({ onToggle: () => { dragging=false; } });

/* ================= 配色 ================= */
const C = {
  paper: '#f0e5cb', ink: '#4a3f33',
  sea: '#4d8a85', seaDeep: '#2c5f63', foam: '#f8f4e8',
  land: '#7fa98c', landDark: '#5d8a6e', sand: '#e2d0a2',
  wood: 0x8a5a3b, woodDark: 0x6d452c,
  tile: 0x3f6b5f, tileBlue: 0x37606e, wall: 0xefe3c8,
  vermilion: 0xb6452f, vermilionCss: '#b6452f', gold: 0xd9a441, goldCss: '#d9a441',
  cloud: 0xfbf7ec, mountain: 0x6f9484,
};

const gradientMap = (() => {
  const data = new Uint8Array([90, 150, 210, 255]);
  const tex = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
})();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
const ART=createArtMaterials(toon);
const basic = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, ...extra });

/* ================= 港口数据（画卷坐标：x ∈ [-20,20]，z ∈ [-8,8]，北负南正） =================
   按真实海上丝路地理排布：中国在右上，航线向西南经占城、马六甲，
   横渡印度洋至古里，再西北入波斯湾抵忽鲁谟斯。 */
const PORTS = [
  { slug: 'quanzhou', name: '泉州',   tag: '刺桐古港',   x: 16.8,  z: -4.9, intro: '宋元东方第一大港，市舶司所在。刺桐花开的季节，万商云集，香料与瓷器在此交换。' },
  { slug: 'guangzhou', name: '广州',  tag: '千年商都',   x: 14.2,  z: -2.4, intro: '蕃坊错落，珠玑、象牙与香料由此上岸，是海丝路上最老的门户之一。' },
  { slug: 'zhancheng', name: '占城',  tag: '中南半岛',   x: 10.9,  z: 1.7,  intro: '今越南中部古港。占城稻与沉香的故乡，商船在此补给淡水和食粮。' },
  { slug: 'malacca', name: '马六甲',  tag: '海峡咽喉',   x: 5.5,   z: 4.9,  intro: '东西航路的十字路口。各国商船在此候风换货，港口昼夜喧闹。' },
  { slug: 'guli', name: '古里',       tag: '胡椒海岸',   x: -9.9,  z: 2.1,  intro: '印度西岸卡利卡特。胡椒、宝石与细棉布堆满码头，郑和船队曾在此立碑。' },
  { slug: 'hormuz', name: '忽鲁谟斯', tag: '波斯湾明珠', x: -15.1, z: -4.5, intro: '霍尔木兹古城。珍珠、地毯、良马与琉璃汇聚，西行航路的繁华终点。' },
];

/* ================= 画卷底图（Canvas 手绘） ================= */
const MAP_W = 40, MAP_H = 16;
function mapToCanvas(x, z, cv) {
  return [ (x + MAP_W / 2) / MAP_W * cv.width, (z + MAP_H / 2) / MAP_H * cv.height ];
}

function paintMap() {
  const cv=document.createElement('canvas');cv.width=3072;cv.height=1256;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const wx=x=>(x+22)/44*W,wz=z=>(z+9)/18*H;
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=8;tex.colorSpace=THREE.SRGBColorSpace;
  let disposed=false;
  tex.addEventListener('dispose',()=>{disposed=true;art.onload=null;art.onerror=null;});
  function draw(image=null) {
    ctx.fillStyle='#e9e1ca';ctx.fillRect(0,0,W,H);
    if(image) ctx.drawImage(image,wx(-20),wz(-8),40/44*W,16/18*H);
    else {
      ctx.fillStyle='#789b94';ctx.fillRect(wx(-20),wz(-8),40/44*W,16/18*H);
      ctx.strokeStyle='rgba(234,231,207,.38)';ctx.lineWidth=.8;
      for(let row=0;row<65;row++) {ctx.beginPath();for(let x=0;x<W;x+=5)ctx.lineTo(x,row*20+Math.sin(x*.015+row*.3)*6);ctx.stroke();}
    }
    // 装裱的细金线与绢边，比粗色块边框更轻。
    ctx.strokeStyle='#a9956e';ctx.lineWidth=1;ctx.strokeRect(wx(-20)-14,wz(-8)-14,40/44*W+28,16/18*H+28);
    ctx.strokeStyle='rgba(229,210,159,.85)';ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.beginPath();
    PORTS.forEach((p,i)=>{const x=wx(p.x),y=wz(p.z);if(!i)ctx.moveTo(x,y);else {const previous=PORTS[i-1];ctx.quadraticCurveTo(wx((previous.x+p.x)/2),wz(Math.max(previous.z,p.z)+.6),x,y);}});ctx.stroke();ctx.setLineDash([]);
    for(const p of PORTS) {
      const x=wx(p.x),y=wz(p.z);
      ctx.fillStyle='#a45e4a';ctx.strokeStyle='#f1e6cc';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.font='34px "STKaiti","KaiTi","Songti SC",serif';ctx.textAlign='center';
      ctx.strokeStyle='rgba(235,225,198,.85)';ctx.lineWidth=7;ctx.lineJoin='round';ctx.strokeText(p.name,x,y-26);
      ctx.fillStyle='#344e48';ctx.fillText(p.name,x,y-26);
    }
    ctx.font='24px "Songti SC",serif';ctx.fillStyle='rgba(235,223,189,.75)';ctx.textAlign='center';
    for(const [name,x,z] of [['南海',14,1],['印度洋',-1,1],['波斯湾',-16,-6]]) name.split('').forEach((ch,i)=>ctx.fillText(ch,wx(x),wz(z)+i*32));
    tex.needsUpdate=true;
  }
  const art=new Image();art.onload=()=>{if(!disposed)draw(art);};art.onerror=()=>{if(!disposed)draw();};
  draw();art.src='/assets/images/silk-road/gongbi-atlas-v2.png';return tex;
}

/* ================= 场景 ================= */
const app = document.getElementById('app');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
  showFatal();
  throw err;
}
function showFatal() {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#f3ead6;color:#4a3f33;font-size:15px;letter-spacing:2px;text-align:center;line-height:2.2;';
  div.innerHTML = '<div>当前浏览器无法创建三维画布（WebGL）。<br/>请更换支持 WebGL 的浏览器后重试。<br/><button onclick="location.reload()" style="margin-top:14px;padding:10px 30px;font-size:15px;letter-spacing:4px;font-family:inherit;background:#4a3f33;color:#f3ead6;border:none;border-radius:9px;cursor:pointer;">重新加载</button></div>';
  document.body.appendChild(div);
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
let baseH = 11;                       // 视野半高（随窗口计算）
const camera = new THREE.OrthographicCamera();
camera.position.set(0, 34, 7.5);      // 近垂直俯视，略倾
camera.lookAt(0, 0, 0.6);
camera.zoom = 1;
function layout() {
  const aspect = innerWidth / innerHeight;
  baseH = Math.max(9.8, 23 / aspect);
  camera.left = -baseH * aspect; camera.right = baseH * aspect;
  camera.top = baseH; camera.bottom = -baseH;
  camera.updateProjectionMatrix();
}
layout();

scene.add(new THREE.AmbientLight(0xfff4dd, 1.15));
const key = new THREE.DirectionalLight(0xffe9c4, 1.5);
key.position.set(-8, 20, 6);
scene.add(key);

/* ---------- 卷面 ---------- */
const scrollGroup = new THREE.Group();
scene.add(scrollGroup);

const paperGeo = new THREE.PlaneGeometry(MAP_W + 4, MAP_H + 2, 110, 26);
paperGeo.rotateX(-Math.PI / 2);
{
  const pos = paperGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const edge = Math.max(0, (Math.abs(x) - MAP_W / 2) / 2);   // 两端卷入轴杆
    pos.setY(i, Math.pow(edge, 1.6) * 2.2 + Math.sin(x * 0.45) * 0.06);
  }
  paperGeo.computeVertexNormals();
}
const paper = new THREE.Mesh(paperGeo, basic(0xffffff, { map: paintMap() }));
scrollGroup.add(paper);

/* 轴杆 */
for (const side of [-1, 1]) {
  const roller = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 0.85, MAP_H + 3.4, 14), toon(C.woodDark));
  roller.rotation.x = Math.PI / 2;
  roller.position.set(side * (MAP_W / 2 + 2.1), 2.3, 0);
  scrollGroup.add(roller);
  for (const capSide of [-1, 1]) {
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.35, 14), toon(C.gold));
    cap.rotation.x = Math.PI / 2;
    cap.position.set(side * (MAP_W / 2 + 2.1), 2.3, capSide * (MAP_H / 2 + 1.85));
    scrollGroup.add(cap);
  }
}

/* ---------- 浮雕建筑 ---------- */
function makeHouse(w,d,h,roofColor) { const house=merchantHouse(w,d,h,ART);return house; }
function makePagoda(s = 1) {
  const g = new THREE.Group();
  let y = 0;
  for (let i = 0; i < 3; i++) {
    const w = (0.55 - i * 0.12) * s;
    const tier = new THREE.Mesh(new THREE.CylinderGeometry(w, w * 1.06, 0.34 * s, 6), toon(C.wall));
    tier.position.y = y + 0.17 * s;
    const eave = new THREE.Mesh(new THREE.ConeGeometry(w * 1.5, 0.24 * s, 6), toon(C.vermilion));
    eave.position.y = y + 0.42 * s;
    g.add(tier, eave);
    y += 0.5 * s;
  }
  const spire = new THREE.Mesh(new THREE.ConeGeometry(0.1 * s, 0.4 * s, 6), toon(C.gold));
  spire.position.y = y + 0.1 * s;
  g.add(spire);
  return g;
}
function makeLighthouse(s = 1) {
  const g = new THREE.Group();
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.24 * s, 1.1 * s, 8), toon(C.wall));
  tower.position.y = 0.55 * s;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.19 * s, 0.21 * s, 0.14 * s, 8), toon(C.vermilion));
  band.position.y = 0.82 * s;
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14 * s, 8, 6), basic(C.gold));
  lamp.position.y = 1.2 * s;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.2 * s, 0.22 * s, 8), toon(C.tileBlue));
  cap.position.y = 1.38 * s;
  g.add(tower, band, lamp, cap);
  return g;
}
function makeLantern(s = 1) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025 * s, 0.025 * s, 0.7 * s, 4), toon(C.woodDark));
  pole.position.y = 0.35 * s;
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.11 * s, 8, 6), basic(C.vermilion));
  lamp.scale.y = 0.85;
  lamp.position.y = 0.72 * s;
  g.add(pole, lamp);
  return g;
}
function makeJunk(s=1) {const ship=harborShip(ART);ship.scale.setScalar(.35*s);return ship;}

const portHits = [];
const lanternLights = [];
PORTS.forEach((p, idx) => {
  const town = new THREE.Group();
  town.position.set(p.x, 0, p.z);town.scale.setScalar(.58);
  // 港口与工笔建筑融为一体，只留下小型立体朱砂标记。
  const marker=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.06,32),basic(0x995b48));marker.position.y=.08;town.add(marker);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.2,.012,6,40),basic(0xe7d6a8));ring.rotation.x=-Math.PI/2;ring.position.y=.06;town.add(ring);
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 2.2, 8),
    basic(0xffffff, { visible: false }));
  hit.scale.set(1/.58,1,1/.58); hit.position.y = 1;
  hit.userData.portIndex = idx;
  town.add(hit);
  portHits.push(hit);
  scrollGroup.add(town);
});

/* 装饰船（沿航路分布） */
const decoShips = [];
for (const [x, z, ry, s] of [[13.8, -0.9, 2.6, 1], [8.2, 3.6, 2.2, 0.85], [-3.2, 2.6, -1.9, 0.95], [-12.6, -1.8, -0.8, 0.9]]) {
  const j = makeJunk(s);
  j.position.set(x, 0.06, z);
  j.rotation.y = ry;
  scrollGroup.add(j);
  j.scale.multiplyScalar(.7);decoShips.push(j);
}

/* 浮云 + 飞鸟 */
const cloudsG = new THREE.Group();
function makeCloud(s = 1) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.4 * s * (0.7 + Math.random() * 0.6), 9, 7), toon(C.cloud));
    puff.position.set((i - 1.5) * 0.5 * s, (Math.random() - 0.5) * 0.15, (Math.random() - 0.5) * 0.3);
    puff.scale.y = 0.55;
    g.add(puff);
  }
  return g;
}
for (let i = 0; i < 5; i++) {
  const cl = makeCloud(0.9 + Math.random() * 0.8);
  cl.position.set(-16 + Math.random() * 32, 2.2 + Math.random() * 1.4, -6 + Math.random() * 12);
  cloudsG.add(cl);
}
cloudsG.visible=false;scene.add(cloudsG);

const birds = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const b = new THREE.Group();
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.12), basic(0x4a3f33));
  w1.rotation.z = 0.5;
  const w2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.12), basic(0x4a3f33));
  w2.rotation.z = -0.5;
  w1.position.x = -0.2; w2.position.x = 0.2;
  b.add(w1, w2);
  b.userData.phase = i * 2.1;
  birds.add(b);
}
scene.add(birds);

/* ================= 相机浏览逻辑 ================= */
const view = { x: 0, z: 0.4, zoom: 1 };          // 当前
const goal = { ...view };                         // 目标
const ZOOM_MIN = 0.75, ZOOM_MAX = 3.2;

function clampGoal() {
  goal.zoom = THREE.MathUtils.clamp(goal.zoom, ZOOM_MIN, ZOOM_MAX);
  const aspect = innerWidth / innerHeight;
  const vw = baseH * aspect / goal.zoom, vh = baseH / goal.zoom;
  const mx = Math.max(0, MAP_W / 2 + 1.2 - vw);
  const mz = Math.max(0, MAP_H / 2 + 1.2 - vh);
  goal.x = THREE.MathUtils.clamp(goal.x, -mx, mx);
  goal.z = THREE.MathUtils.clamp(goal.z, -mz, mz);
  goal.zoom = THREE.MathUtils.clamp(goal.zoom, ZOOM_MIN, ZOOM_MAX);
}

renderer.domElement.addEventListener('wheel', (e) => {
  if (bag.isOpen()) return;
  if (Math.abs(e.deltaY) < 4) return;
  goal.zoom *= e.deltaY > 0 ? 0.88 : 1.14;
  clampGoal();
  hideCard();
}, { passive: true });

let dragging=false,moved=0,px=0,py=0,pinchDistance=0;
const touchPoints=new Map();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (bag.isOpen()) return;
  renderer.domElement.setPointerCapture(e.pointerId);
  touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragging=true;moved=0;px=e.clientX;py=e.clientY;
  if(touchPoints.size===2) {const [a,b]=[...touchPoints.values()];pinchDistance=Math.hypot(a.x-b.x,a.y-b.y);moved=1000;}
});
addEventListener('pointermove', (e) => {
  if(!dragging)return;
  if(touchPoints.has(e.pointerId))touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touchPoints.size===2) {const [a,b]=[...touchPoints.values()],distance=Math.hypot(a.x-b.x,a.y-b.y);if(pinchDistance>0){goal.zoom*=distance/pinchDistance;clampGoal();hideCard();}pinchDistance=distance;moved=1000;return;}
  const aspect = innerWidth / innerHeight;
  const scale = (baseH * 2) / innerHeight / view.zoom;
  goal.x -= (e.clientX - px) * scale;
  goal.z -= (e.clientY - py) * scale / 1.02;
  moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py);
  px = e.clientX; py = e.clientY;
  clampGoal();
});
addEventListener('pointerup', (e) => {
  touchPoints.delete(e.pointerId);pinchDistance=0;
  if (!dragging) return;
  dragging = false;
  if (bag.isOpen()) return;
  if (moved < 6) {
    const ndc = new THREE.Vector2(
      (e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    const rc = new THREE.Raycaster();
    rc.setFromCamera(ndc, camera);
    const hits = rc.intersectObjects(portHits, false);
    if (hits.length) flyToPort(hits[0].object.userData.portIndex);
  }
});

/* 抵达卡片与名册 */
const arriveCard = document.getElementById('arriveCard');
arriveCard.inert=true;
let curPort=0;
const portSelect=document.getElementById('portSelect');
PORTS.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=p.name;portSelect.append(option);});
portSelect.addEventListener('change',()=>flyToPort(Number(portSelect.value)));
function markChip(i) {portSelect.value=String(i);}
function showCard(i) {
  const p = PORTS[i];
  document.getElementById('portName').textContent = p.name;
  document.getElementById('portTag').textContent = p.tag;
  document.getElementById('portIntro').textContent = p.intro;
  arriveCard.inert=false; arriveCard.classList.add('show');
}
function hideCard() { clearTimeout(flyTimer); arriveCard.inert=true; arriveCard.classList.remove('show'); }

let flyTimer = null;
function flyToPort(i) {
  hideCard(); curPort = i;
  const url=new URL(location.href); url.searchParams.set('port',PORTS[i].slug); history.replaceState({},'',url);
  markChip(i);
  goal.x = PORTS[i].x; goal.z = PORTS[i].z + 0.6; goal.zoom = 2.4;
  clampGoal();
  clearTimeout(flyTimer);
  flyTimer = setTimeout(() => showCard(i), 620);
}
function resetMap() {
  hideCard();
  goal.x = 0; goal.z = 0.4; goal.zoom = 1;
  clampGoal();
}
document.getElementById('btnSail').addEventListener('click', resetMap);

document.getElementById('btnExplore').addEventListener('click', () => {
  /* 进入二级页面：港口城市 */
  location.href = `./silk-road-port.html?port=${PORTS[curPort].slug}`;
});
markChip(0);

/* URL 直航参数：?port=2 打开指定港口（供后续二级页面入口复用） */
{
  const q = new URLSearchParams(location.search).get('port');
  if (q !== null) {
    const bySlug=PORTS.findIndex(p=>p.slug===q);
    const i = bySlug>=0 ? bySlug : Math.min(Math.max(parseInt(q,10)||0,0),PORTS.length-1);
    flyToPort(i);

}

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
let sceneFrame=0;
function tick() {
  sceneFrame=requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 相机缓动 */
  const k = 1 - Math.pow(0.0015, dt);
  view.x += (goal.x - view.x) * k;
  view.z += (goal.z - view.z) * k;
  view.zoom += (goal.zoom - view.zoom) * k;
  camera.zoom = view.zoom;
  camera.position.set(view.x, 34, view.z + 7.5);
  camera.lookAt(view.x, 0, view.z + 0.6);
  camera.updateProjectionMatrix();

  /* 灯笼呼吸 */
  lanternLights.forEach((l, i) => {
    const s = 1 + Math.sin(t * 2.4 + i) * 0.12;
    l.scale.set(s, s * 0.85, s);
  });
  /* 船只轻晃 */
  decoShips.forEach((j, i) => {
    j.position.y = 0.06 + Math.sin(t * 1.5 + i * 2) * 0.05;
    j.rotation.z = Math.sin(t * 1.1 + i) * 0.03;
  });
  /* 云漂移 */
  cloudsG.children.forEach((c, i) => {
    c.position.x += dt * (0.25 + i * 0.06);
    if (c.position.x > 20) c.position.x = -20;
  });
  /* 飞鸟盘旋 */
  birds.children.forEach((b, i) => {
    const a = t * 0.25 + b.userData.phase;
    b.position.set(Math.cos(a) * 9, 3.2 + Math.sin(t * 0.9 + i) * 0.3, Math.sin(a) * 5);
    b.rotation.y = -a;
    const flap = Math.sin(t * 6 + i) * 0.25;
    b.children[0].rotation.z = 0.5 + flap;
    b.children[1].rotation.z = -0.5 - flap;
  });

  renderer.render(scene, camera);
}
tick();

renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;touchPoints.clear();pinchDistance=0;});
addEventListener('blur', () => { dragging=false; });
renderer.domElement.addEventListener('webglcontextlost', e=> { e.preventDefault(); cancelAnimationFrame(sceneFrame); const panel=document.createElement('div'); panel.className='bag-layer'; panel.innerHTML='<section class="bag-panel"><h2>画卷暂时中断</h2><p>请重新加载恢复，行囊保留在本地。</p><button onclick="location.reload()">重新加载</button></section>'; document.body.append(panel); });
addEventListener('pagehide', e => { if(e.persisted) return; cancelAnimationFrame(sceneFrame); clearTimeout(flyTimer); const geometries=new Set(), materials=new Set(), textures=new Set(); scene.traverse(o=> { if(o.geometry) geometries.add(o.geometry); for(const m of o.material ? (Array.isArray(o.material)?o.material:[o.material]):[]) { materials.add(m); for(const v of Object.values(m)) if(v?.isTexture) textures.add(v); } }); geometries.forEach(g=>g.dispose()); materials.forEach(m=>m.dispose()); textures.forEach(t=>t.dispose()); renderer.dispose(); });
addEventListener('resize', () => { layout(); renderer.setSize(innerWidth, innerHeight); clampGoal(); });
</script>
