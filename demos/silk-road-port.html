<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>海上丝绸之路 · 港口</title>
<style>
  :root {
    --paper: #f3ead6;
    --ink: #4a3f33;
    --vermilion: #b6452f;
    --teal: #2c5f63;
    --gold: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    background: radial-gradient(120% 90% at 50% 0%, #f6efdc 0%, #ece2c6 55%, #d5cdb0 100%);
    color: var(--ink);
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; cursor: pointer; }

  header {
    position: fixed; top: 22px; left: 26px; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    pointer-events: none; user-select: none;
  }
  .seal {
    width: 58px; height: 58px; border-radius: 10px;
    background: var(--vermilion); color: #fdf6e7;
    font-size: 19px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; letter-spacing: 2px;
    box-shadow: 0 3px 10px rgba(182,69,47,.35), inset 0 0 0 2px rgba(253,246,231,.55);
    transform: rotate(-3deg);
  }
  .title h1 { font-size: 24px; letter-spacing: 6px; font-weight: 700; }
  .title p { margin-top: 6px; font-size: 12px; letter-spacing: 3px; opacity: .75; }

  .nav {
    position: fixed; top: 26px; right: 26px; z-index: 10; font-size: 13px; letter-spacing: 2px;
  }
  .nav a {
    display: inline-block; padding: 9px 16px; margin-left: 8px;
    border: 1.5px solid var(--ink); border-radius: 999px;
    color: var(--ink); text-decoration: none; background: rgba(243,234,214,.75);
    transition: all .2s;
  }
  .nav a:hover { box-shadow: 0 2px 8px rgba(74,63,51,.3); }

  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 13px; letter-spacing: 3px; opacity: .8;
    background: rgba(243,234,214,.78); padding: 8px 22px; border-radius: 999px;
    border: 1px solid rgba(74,63,51,.3); user-select: none; pointer-events: none;
    white-space: nowrap;
  }

  /* ---------- 抵达卡（二级入口） ---------- */
  #arrive {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(44, 95, 99, .32); backdrop-filter: blur(5px);
    transition: opacity .5s;
  }
  #arrive.hide { opacity: 0; pointer-events: none; }
  #arrive .panel {
    width: min(480px, 88vw); text-align: center;
    background: linear-gradient(160deg, #f8f1de, #eee1c4);
    border: 2px solid var(--ink); border-radius: 16px;
    padding: 36px 34px 30px;
    box-shadow: 0 20px 50px rgba(40,40,40,.35);
  }
  #arrive h2 { font-size: 30px; letter-spacing: 8px; }
  #arrive h2 small { display: block; margin-top: 6px; font-size: 13px; letter-spacing: 4px; color: var(--vermilion); }
  #arrive .line { height: 1px; background: linear-gradient(90deg, transparent, var(--ink), transparent); margin: 14px 0; opacity: .5; }
  #arrive p { font-size: 14px; line-height: 2; letter-spacing: 1.5px; opacity: .88; }
  #arrive .row { display: flex; gap: 14px; margin-top: 22px; }
  #arrive button {
    flex: 1; padding: 13px 0; font-size: 16px; letter-spacing: 5px;
    font-family: inherit; border-radius: 10px; cursor: pointer; transition: all .2s;
  }
  #btnLand { background: var(--vermilion); color: #fdf6e7; border: none; box-shadow: 0 4px 12px rgba(182,69,47,.35); }
  #btnLand:hover { transform: translateY(-2px); }
  #btnLeave { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  #btnLeave:hover { background: rgba(74,63,51,.08); }

  /* ---------- 三级：特写对话框 ---------- */
  #dialog {
    position: fixed; right: 26px; top: 50%; transform: translateY(-50%) translateX(30px);
    z-index: 25; width: min(360px, 84vw);
    background: linear-gradient(165deg, #f8f1de, #efe3c8);
    border: 1.5px solid var(--ink); border-radius: 14px;
    box-shadow: 0 12px 34px rgba(74,63,51,.3);
    padding: 20px 22px 16px;
    opacity: 0; pointer-events: none;
    transition: all .4s cubic-bezier(.2,.9,.3,1.15);
  }
  #dialog.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
  #dialog h3 { font-size: 21px; letter-spacing: 4px; display: flex; align-items: baseline; gap: 8px; }
  #dialog h3 small { font-size: 11px; letter-spacing: 2px; color: var(--vermilion); }

  #dialog p { font-size: 14px; line-height: 1.9; letter-spacing: 1.2px; opacity: .9; }
  #dialog .goods { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  #dialog .goods button {

  #dialog .goods button:hover { background: rgba(182,69,47,.16); transform: translateX(3px); }
  #dialog .goods button b { font-weight: 400; font-size: 12px; color: var(--vermilion); }
  #dlgClose {
    width: 100%; margin-top: 14px; padding: 10px 0; font-size: 14px; letter-spacing: 4px;
    font-family: inherit; background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 9px; cursor: pointer;
  }
  #dlgClose:hover { background: rgba(74,63,51,.08); }

  /* ---------- 四级：商品详情 ---------- */
  #product {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(44, 60, 55, .45); backdrop-filter: blur(6px);

    padding: 6px 14px; font-size: 12px; letter-spacing: 2px; font-family: inherit;
    background: rgba(243,234,214,.85); color: var(--ink);
    border: 1px solid rgba(74,63,51,.4); border-radius: 999px; cursor: pointer;
  }
  #prodInfo {

  #prodInfo h3 { font-size: 24px; letter-spacing: 4px; }
  #prodInfo .price { margin: 8px 0 4px; font-size: 20px; color: var(--vermilion); letter-spacing: 2px; }
  #prodInfo .price small { font-size: 11px; color: var(--ink); opacity: .6; letter-spacing: 1px; }
  #prodInfo .line { height: 1px; background: linear-gradient(90deg, var(--ink), transparent); margin: 12px 0; opacity: .4; }
  #prodInfo p { font-size: 13.5px; line-height: 2; letter-spacing: 1.2px; opacity: .9; margin-bottom: 10px; }
  #prodInfo li { font-size: 13px; line-height: 2; letter-spacing: 1px; opacity: .85; list-style: none; }
  #prodInfo li::before { content: '◆'; margin-right: 8px; color: var(--gold); font-size: 10px; }
  #prodClose {
    margin-top: 18px; width: 100%; padding: 12px 0; font-size: 15px; letter-spacing: 4px;

  @media (max-width: 720px) {

    .title h1 { font-size: 18px; letter-spacing: 3px; }
    .seal { width: 44px; height: 44px; font-size: 15px; }
    .nav { top: 16px; right: 12px; }
    .nav a { padding: 6px 10px; font-size: 11px; }

    #prodStage { min-height: 46%; }
    #dialog { right: 12px; width: min(320px, 80vw); }
  }
</style>

<script type="module">

const bag = mountCart({ onToggle: () => { clearKeys(); moveTarget = null; route = []; pendingRef = null; } });

/* ================= 配色与材质 ================= */
const C = {
  paper: 0xf3ead6, ink: 0x4a3f33,
  sea: 0x739b96, foam: 0xf8f4e8,
  stone: 0xc3c3b1, stoneDark: 0xa9ad9d,
  wood: 0x826650, woodDark: 0x51483d, woodRed: 0x885442,
  tile: 0x536e67, tileBlue: 0x54716f, wall: 0xe4dfcd,
  vermilion: 0x9b5947, gold: 0xb5a16b,
  leaf: 0x5d8a6e, leafLight: 0x79a888, cloud: 0xfbf7ec,
  skin: 0xf2d3b3, robe1: 0x37606e, robe2: 0x9c4a38, robe3: 0x6b7a4a, robe4: 0x7a5a8c,
};
const gradientMap = (() => {
  const data = new Uint8Array([95, 165, 214, 245]);
  const tex = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
})();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
const ART=createArtMaterials(toon);
const basic = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, ...extra });

function textPlane(text, { w = 256, h = 128, font = 64, fg = '#4a3f33', bg = null, vertical = false } = {}) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  ctx.fillStyle = fg;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (vertical) {
    ctx.font = `700 ${font}px "STKaiti", "KaiTi", "Songti SC", serif`;
    const chars = text.split('');
    const step = Math.min(font * 1.12, (h - 20) / chars.length);
    chars.forEach((ch, i) => ctx.fillText(ch, w / 2, h / 2 + (i - (chars.length - 1) / 2) * step));
  } else {
    ctx.font = `700 ${font}px "STKaiti", "KaiTi", "Songti SC", serif`;
    ctx.fillText(text, w / 2, h / 2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  },

    vendor: { name: '陈婆', tag: '杂货老铺', lines: '靓仔，看看醒狮公仔啦！过年行花街，人手一只，好意头！' },
    walker: '蕃坊的波斯商人又在收珠玑了，价钱一日三变。',

    vendor: { name: '阿香', tag: '沉香米行', lines: '远来的客人，带上些沉香吧，点一炉，满室都是山林的味道。' },

    goods: ['mug', 'rudder', 'brick-ship'],
  },
  guli: {
    name: '古里', tag: '胡椒海岸', seal: '古里',
    intro: '印度西岸卡利卡特。胡椒、宝石与细棉布堆满码头，郑和船队曾在此立碑。',

    vendor: { name: '拉吉', tag: '胡椒宝石行', lines: '上等的黑胡椒，一粒抵一粒银！再看看这细棉布，薄得能穿过戒指。' },

const requestedSlug = new URLSearchParams(location.search).get('port');
const slug = Object.hasOwn(PORT_CFG, requestedSlug) ? requestedSlug : 'quanzhou';
const CFG = PORT_CFG[slug] || PORT_CFG.quanzhou;

document.getElementById('portSub').textContent = CFG.tag;
document.querySelector('.nav a').href = `./silk-road-scroll.html?port=${slug}`;
document.getElementById('sealText').textContent = CFG.seal.slice(0, 2);
document.getElementById('arrName').textContent = CFG.name;
document.getElementById('arrTag').textContent = CFG.tag;
document.getElementById('arrIntro').textContent = CFG.intro;

/* ================= 基础场景 ================= */
const app = document.getElementById('app');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

function walkable(x, z) {
  const inA = x >= -6.4 && x <= 6.4 && z >= -7.6 && z <= 12.9;

function collide(x, z) {
  for (const o of obstacles) {
    const dx = x - o.x, dz = z - o.z;
    const d = Math.hypot(dx, dz);
    const min = o.r + 0.28;
    if (d < min && d > 0.001) {
      x = o.x + dx / d * min;
      z = o.z + dz / d * min;
    }
  }
  return [x, z];
}

function qinghuaTex() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f6f2e6';
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#2b5aa0';
  ctx.fillStyle = '#2b5aa0';
  /* 上下青边带 */
  for (const y of [30, 460]) {
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
    for (let x = 20; x < 512; x += 46) {
      ctx.beginPath(); ctx.arc(x, y + (y < 100 ? 24 : -24), 13, 0, Math.PI * 2); ctx.stroke();
    }
  }
  /* 缠枝莲 */
  ctx.lineWidth = 6;
  for (let i = 0; i < 4; i++) {
    const cx = 90 + i * 115, cy = 250 + (i % 2 ? -50 : 50);
    for (let p = 0; p < 6; p++) {
      const a = (p / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30, 16, 9, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 58, cy, 52, Math.PI * 0.4, Math.PI * 1.2);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function lianpuTex() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#f6f2e6';

  ctx.fillStyle = '#f6f2e6';

  ctx.beginPath(); ctx.ellipse(290, 105, 18, 12, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(200, 82); ctx.quadraticCurveTo(222, 66, 244, 84); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(268, 84); ctx.quadraticCurveTo(290, 66, 312, 82); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(256, 120); ctx.lineTo(256, 160); ctx.stroke();

    r2.domElement.addEventListener('pointermove', e => {
      if (!dragging) return; rotY += (e.clientX-px)*.01; rotX = THREE.MathUtils.clamp(rotX+(e.clientY-py)*.008,-.9,.9);
      px=e.clientX; py=e.clientY; apply();
    }, opts);
    for (const event of ['pointerup','pointercancel','lostpointercapture']) r2.domElement.addEventListener(event, () => { dragging=false; }, opts);
    r2.domElement.addEventListener('wheel', e => { e.preventDefault(); scale=THREE.MathUtils.clamp(scale*(e.deltaY>0?.92:1.08),.6,1.8); apply(); }, { ...opts, passive:false });
    document.getElementById('btnResetView').addEventListener('click', () => { rotX=0; rotY=initialRotation; scale=1; apply(); }, opts);
    const observer = new ResizeObserver(() => {
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      if (!w || !h) return;
      r2.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix();
    }); observer.observe(stageEl);
    const loop = () => { raf=requestAnimationFrame(loop); if (!bag.isOpen() && !document.hidden) r2.render(sc,cam); }; loop();
    pr = () => { cancelAnimationFrame(raf); controller.abort(); observer.disconnect(); releaseScene(sc); r2.dispose(); r2.forceContextLoss(); r2.domElement.remove(); };
  } catch {
    releaseScene(sc); if (r2) { r2.dispose(); r2.domElement.remove(); }
    const fallback=document.createElement('p'); fallback.id='prodFallback'; fallback.textContent=`${p.name}：三维预览暂不可用，可阅读右侧资料并继续选购。`; stageEl.append(fallback);
  }
  document.getElementById('prodInfo').scrollTop=0;
  document.getElementById('btnResetView').focus({ preventScroll:true });
}
function closeProduct(record = true) {
  if (record && new URLSearchParams(location.search).has('product')) { leaveLayer('product'); return; }
  disposeProduct(); mode='dialog'; dialogEl.classList.add('show');
}
productEl.addEventListener('keydown', e => {
  if(e.key !== 'Tab' || bag.isOpen()) return;
  const controls=[...productEl.querySelectorAll('button,input,select')];
  const first=controls[0],last=controls.at(-1);
  if(e.shiftKey && document.activeElement===first) { e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last) { e.preventDefault(); first.focus(); }
});
document.getElementById('prodClose').addEventListener('click', () => closeProduct());
document.getElementById('addBag').addEventListener('click', () => {
  const p = PRODUCTS[currentProduct]; if (!p) return;
  const count = quantity(document.getElementById('prodCount').value); document.getElementById('prodCount').value = count;
  bag.add({ id: currentProduct, name: p.name, variant: document.getElementById('prodVariant').value, count, price: Number(p.price.slice(1)) });
  document.getElementById('addNote').textContent = `已将 ${count} 件${p.name}放进行囊，可继续去其他港口。`;
});
function leaveLayer(name) {
  if(history.state?.silkLayer) { history.back(); return; }
  const url=new URL(location.href); url.searchParams.delete(name);
  if(name==='ref') url.searchParams.delete('product');
  url.searchParams.set('explore','1'); history.replaceState({},'',url); restoreLayer();
}
function restoreLayer() {
  if (bag.isOpen()) bag.close();
  disposeProduct(); dialogEl.classList.remove('show'); clearKeys(); route=[]; moveTarget=null; pendingRef=null;
  const params = new URLSearchParams(location.search);
  const explore = params.has('explore') || params.has('ref');
  document.getElementById('arrive').classList.toggle('hide', explore);
  mode = explore ? 'roam' : 'arrive';
  if(explore && !hasRestored) character.position.set(0,0,10.5);
  hasRestored=true;
  document.getElementById('journeyNote').textContent=explore?'沿街漫游 · 选择货摊、人物或港口地标':'抵达古港 · 下船后可自由探索';
  setCloseupVisibility(); activeRef=null;
  if(!explore) character.position.set(2.9,.6,16.6);
  else if(character.position.x>1.05 && character.position.z>12.9) character.position.set(0,0,16.6);
  goalHeight=17.57;goalDepth=12;goalSide=12;goalAim=.6; goalZoom=1;
  goalFocus.copy(character.position);
  const ref=REFS[params.get('ref')];
  if (ref) { openDialog(ref,false); if (ref.goods?.includes(params.get('product'))) openProduct(params.get('product'),false); }
}
addEventListener('popstate', restoreLayer);

/* ================= 抵达入口 ================= */
document.getElementById('btnLand').addEventListener('click', () => {
  document.getElementById('arrive').classList.add('hide');
  mode = 'disembark'; landingProgress=0;
  pushLayer({ explore: '1' });
  document.getElementById('journeyNote').textContent='沿舷梯下船 · 前往港口主街';       // 自动走下码头
});
document.getElementById('btnLeave').addEventListener('click', () => {
  location.href = `./silk-road-scroll.html?port=${slug}`;
});

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
const SPEED = 4.2;

function stepCharacter(dt) {
  let vx = 0, vz = 0;
  if (keys['w'] || keys['arrowup']) vz -= 1;
  if (keys['s'] || keys['arrowdown']) vz += 1;
  if (keys['a'] || keys['arrowleft']) vx -= 1;
  if (keys['d'] || keys['arrowright']) vx += 1;
  if (vx || vz) {
    moveTarget = null; route=[]; pendingRef=null;
    const len = Math.hypot(vx, vz);
    const screenX=vx/len,screenZ=vz/len;
    vx=(screenX+screenZ)*Math.SQRT1_2*SPEED;vz=(screenZ-screenX)*Math.SQRT1_2*SPEED;
  } else if (moveTarget) {
    const dx = moveTarget.x - character.position.x;
    const dz = moveTarget.z - character.position.z;
    const d = Math.hypot(dx, dz);
    if (d < .08) { moveTarget=route.shift() || null; if (!moveTarget && pendingRef) { const ref=pendingRef; pendingRef=null; openDialog(ref); } return; }
    const speed = Math.min(SPEED, d / dt); vx = dx / d * speed; vz = dz / d * speed;
  } else return;
  let nx = character.position.x + vx * dt;
  let nz = character.position.z + vz * dt;
  if (!walkable(nx, nz)) {
    if (walkable(nx, character.position.z)) nz = character.position.z;
    else if (walkable(character.position.x, nz)) nx = character.position.x;
    else { moveTarget = null; return; }
  }
  if (!isClear(nx,nz)) {
    if (isClear(nx,character.position.z)) nz=character.position.z;
    else if (isClear(character.position.x,nz)) nx=character.position.x;
    else { moveTarget=null; route=[]; pendingRef=null; return; }
  }
  character.position.x = nx;
  character.position.z = nz;
  character.rotation.y = Math.atan2(vx, vz);
  character.position.y = Math.abs(Math.sin(clock.elapsedTime * 10)) * 0.05;
}

let sceneFrame=0;
function tick() {
  sceneFrame=requestAnimationFrame(tick);
  document.body.dataset.mode=mode;
  if(mode!=='roam') hoverLabel.hidden=true;
  footRing.visible=mode==='roam';footRing.position.x=character.position.x;footRing.position.z=character.position.z;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if(mode==='disembark' && !bag.isOpen()) { landingProgress=Math.min(1,landingProgress+dt*.65); character.position.set(2.9*(1-landingProgress),.6*(1-landingProgress),16.6); goalFocus.copy(character.position); if(landingProgress===1) { mode='roam'; walkTo(0,10.5); } }
  if (mode === 'roam' && !bag.isOpen()) stepCharacter(dt);

  /* 路人巡走 */
  if (mode === 'dialog' || mode === 'product' || bag.isOpen()) { /* 对话时人物停步 */ } else if (walkPause > 0) {
    walkPause -= dt;
  } else {
    const [tx2, tz2] = walkPath[walkIdx];
    const dx = tx2 - walker.position.x, dz = tz2 - walker.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.2) { walkIdx = (walkIdx + 1) % walkPath.length; walkPause = 1.6 + Math.random() * 2; }
    else {
      walker.position.x += dx / d * 1.4 * dt;
      walker.position.z += dz / d * 1.4 * dt;
      walker.rotation.y = Math.atan2(dx, dz);
      walker.position.y = Math.abs(Math.sin(t * 7)) * 0.04;
    }
  }
  walkerProxy.position.x = walker.position.x;
  walkerProxy.position.z = walker.position.z;

  /* 待机小动作 */
  vendor.rotation.y = 0.3 + Math.sin(t * 0.8) * 0.15;
  idler.position.y = Math.sin(t * 1.4) * 0.02;
  lanterns.forEach((l, i) => {
    const s = 1 + Math.sin(t * 2.2 + i * 1.3) * 0.1;
    l.scale.set(s, s * 0.85, s);
  });
  ship.position.y = -0.05 + Math.sin(t * 1.2) * 0.06;
  ship.rotation.z = Math.sin(t * 0.9) * 0.02;
  cloudsG.children.forEach((c, i) => {
    c.position.x += dt * (0.3 + i * 0.08);
    if (c.position.x > 20) c.position.x = -20;
  });
  birds.children.forEach((b, i) => {
    const a = t * 0.3 + b.userData.phase;
    b.position.set(Math.cos(a) * 10, 9 + Math.sin(t + i) * 0.5, Math.sin(a) * 7 + 2);
    b.rotation.y = -a;
    const flap = Math.sin(t * 6 + i) * 0.3;
    b.children[0].rotation.z = 0.5 + flap;
    b.children[1].rotation.z = -0.5 - flap;
  });

  /* 相机缓动 */
  if (mode === 'roam') goalFocus.set(character.position.x,0,character.position.z-3.0);
  const k = 1 - Math.pow(0.002, dt);
  camFocus.lerp(goalFocus, k);
  camZoom += (goalZoom - camZoom) * k;
  camera.zoom = camZoom;
  camSide+=(goalSide-camSide)*k;camHeight+=(goalHeight-camHeight)*k; camDepth+=(goalDepth-camDepth)*k; camAim+=(goalAim-camAim)*k;
  camera.position.set(camFocus.x+camSide,camHeight,camFocus.z+camDepth);
  camera.lookAt(camFocus.x,camAim,camFocus.z);
  camera.updateProjectionMatrix();

  // 遮挡角色的前景民居淡出，斜视漫游与窄屏都能看清脚下位置。
  const sightTarget=character.position.clone().add(new THREE.Vector3(0,.9,0));
  const sight=new THREE.Ray(camera.position,sightTarget.clone().sub(camera.position).normalize());
  const sightLength=camera.position.distanceTo(sightTarget);
  for(const house of streetHouses) {
    const hit=sight.intersectBox(house.bounds,new THREE.Vector3());
    const covered=mode==='roam' && hit && camera.position.distanceTo(hit)<sightLength;
    house.opacity+=((covered ? 0.18 : 1)-house.opacity)*k;
    for(const material of house.materials) {material.opacity=house.opacity;material.depthWrite=house.opacity>.95;}
  }

  seaMap.offset.x=Math.sin(t*.025)*.008;seaMap.offset.y=t*.0008;
  renderer.render(scene, camera);
}
scene.traverse(o=>{ if(o.isMesh && o!==water && o.material?.visible!==false) {o.castShadow=true;o.receiveShadow=true;} });
restoreLayer();
tick();

addEventListener('resize', () => { layout(); renderer.setSize(innerWidth, innerHeight); if (activeRef && mode !== 'roam') { const f=activeRef.focus || [walker.position.x,walker.position.z]; goalFocus.set(f[0]+(innerWidth<720?0:2),0,f[1]+(innerWidth<720?1.5:0)); } });
addEventListener('pagehide', e => { if (e.persisted) return; cancelAnimationFrame(sceneFrame); disposeProduct(); releaseScene(scene); gradientMap.dispose(); renderer.dispose(); });
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(sceneFrame); const panel=document.createElement('div'); panel.className='bag-layer'; panel.innerHTML='<section class="bag-panel"><h2>三维画面暂时中断</h2><p>行囊已保存在浏览器中，可重新加载恢复。</p><button onclick="location.reload()">重新加载</button></section>'; document.body.append(panel); });
</script>
</body>
</html>
